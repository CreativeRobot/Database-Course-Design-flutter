<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1280" viewBox="0 0 1900 1280">
  <defs>
    <style>
      .title{font:700 30px "Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif;fill:#0f172a}
      .subtitle{font:400 16px "Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif;fill:#64748b}
      .group-title{font:700 19px "Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif;fill:#1e293b}
      .label{font:500 16px "Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif;fill:#0f172a}
      .actor-label{font:600 18px "Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif;fill:#0f172a}
      .small{font:400 14px "Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif;fill:#475569}
      .actor-line{stroke:#334155;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
      .assoc{stroke:#64748b;stroke-width:2.2;fill:none}
      .include{stroke:#0ea5e9;stroke-width:2;fill:none;stroke-dasharray:7 6}
      .extend{stroke:#f59e0b;stroke-width:2;fill:none;stroke-dasharray:7 6}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
    <marker id="blueArrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0ea5e9"/></marker>
    <marker id="orangeArrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#94a3b8" flood-opacity=".22"/></filter>
  </defs>

  <rect width="1900" height="1280" fill="#f8fafc"/>
  <text x="950" y="55" text-anchor="middle" class="title">在线书店系统用例图</text>
  <text x="950" y="84" text-anchor="middle" class="subtitle">BookStore_Flutter 课设：从角色视角描述系统提供的主要业务功能</text>

  <!-- system boundary -->
  <rect x="330" y="115" width="1260" height="1060" rx="18" fill="#ffffff" stroke="#1e293b" stroke-width="3" filter="url(#shadow)"/>
  <text x="360" y="150" class="group-title">在线书店系统</text>

  <!-- groups -->
  <rect x="370" y="180" width="1180" height="220" rx="14" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
  <text x="395" y="215" class="group-title">公共浏览与认证</text>
  <rect x="370" y="425" width="1180" height="350" rx="14" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="2"/>
  <text x="395" y="460" class="group-title">用户购书与个人中心</text>
  <rect x="370" y="800" width="1180" height="345" rx="14" fill="#fff7ed" stroke="#fed7aa" stroke-width="2"/>
  <text x="395" y="835" class="group-title">后台管理</text>

  <!-- use case ellipse helper manually -->
  <g fill="#ffffff" stroke="#334155" stroke-width="2">
    <ellipse cx="510" cy="275" rx="105" ry="35"/><ellipse cx="760" cy="275" rx="105" ry="35"/><ellipse cx="1010" cy="275" rx="105" ry="35"/><ellipse cx="1260" cy="275" rx="105" ry="35"/>
    <ellipse cx="510" cy="350" rx="105" ry="35"/><ellipse cx="760" cy="350" rx="105" ry="35"/>
    <ellipse cx="510" cy="525" rx="105" ry="35"/><ellipse cx="760" cy="525" rx="105" ry="35"/><ellipse cx="1010" cy="525" rx="105" ry="35"/><ellipse cx="1260" cy="525" rx="105" ry="35"/>
    <ellipse cx="510" cy="610" rx="105" ry="35"/><ellipse cx="760" cy="610" rx="105" ry="35"/><ellipse cx="1010" cy="610" rx="105" ry="35"/><ellipse cx="1260" cy="610" rx="105" ry="35"/>
    <ellipse cx="510" cy="695" rx="105" ry="35"/><ellipse cx="760" cy="695" rx="105" ry="35"/><ellipse cx="1010" cy="695" rx="105" ry="35"/><ellipse cx="1260" cy="695" rx="105" ry="35"/>
    <ellipse cx="510" cy="900" rx="105" ry="35"/><ellipse cx="760" cy="900" rx="105" ry="35"/><ellipse cx="1010" cy="900" rx="105" ry="35"/><ellipse cx="1260" cy="900" rx="105" ry="35"/>
    <ellipse cx="510" cy="1015" rx="105" ry="35"/><ellipse cx="760" cy="1015" rx="105" ry="35"/><ellipse cx="1010" cy="1015" rx="105" ry="35"/><ellipse cx="1260" cy="1015" rx="105" ry="35"/>
  </g>

  <!-- labels -->
  <g class="label" text-anchor="middle">
    <text x="510" y="281">注册账号</text><text x="760" y="281">登录系统</text><text x="1010" y="281">浏览图书</text><text x="1260" y="281">搜索图书</text>
    <text x="510" y="356">查看图书详情</text><text x="760" y="356">查看图书评价</text>
    <text x="510" y="531">查看推荐图书</text><text x="760" y="531">管理购物车</text><text x="1010" y="531">提交订单</text><text x="1260" y="531">支付订单</text>
    <text x="510" y="616">查看/管理订单</text><text x="760" y="616">取消订单</text><text x="1010" y="616">确认收货</text><text x="1260" y="616">申请退款</text>
    <text x="510" y="701">评价图书</text><text x="760" y="701">管理个人资料</text><text x="1010" y="701">管理收货地址</text><text x="1260" y="701">修改密码</text>
    <text x="510" y="906">管理用户</text><text x="760" y="906">管理图书</text><text x="1010" y="906">管理分类</text><text x="1260" y="906">管理作者与出版社</text>
    <text x="510" y="1021">管理库存</text><text x="760" y="1021">管理订单与发货</text><text x="1010" y="1021">管理评论</text><text x="1260" y="1021">审核退款</text>
  </g>
  <ellipse cx="1430" cy="1090" rx="105" ry="35" fill="#ffffff" stroke="#334155" stroke-width="2"/><text x="1430" y="1096" text-anchor="middle" class="label">查看统计信息</text>

  <!-- actors left -->
  <g class="actor-line">
    <circle cx="95" cy="300" r="23"/><path d="M95 323 L95 388 M60 350 L130 350 M95 388 L65 435 M95 388 L125 435"/>
    <circle cx="95" cy="610" r="23"/><path d="M95 633 L95 698 M60 660 L130 660 M95 698 L65 745 M95 698 L125 745"/>
  </g>
  <text x="95" y="470" text-anchor="middle" class="actor-label">游客</text>
  <text x="95" y="780" text-anchor="middle" class="actor-label">普通用户</text>

  <!-- actor right -->
  <g class="actor-line">
    <circle cx="1780" cy="600" r="23"/><path d="M1780 623 L1780 688 M1745 650 L1815 650 M1780 688 L1750 735 M1780 688 L1810 735"/>
    <circle cx="1780" cy="990" r="23"/><path d="M1780 1013 L1780 1078 M1745 1040 L1815 1040 M1780 1078 L1750 1125 M1780 1078 L1810 1125"/>
  </g>
  <text x="1780" y="770" text-anchor="middle" class="actor-label">管理员</text>
  <text x="1780" y="1165" text-anchor="middle" class="actor-label">支付系统（可选）</text>

  <!-- association lines, kept to major use cases for readability -->
  <g class="assoc" marker-end="url(#arrow)">
    <path d="M130 340 L405 275"/><path d="M130 365 L405 275"/><path d="M130 400 L405 350"/><path d="M130 420 L655 350"/>
    <path d="M130 660 L405 525"/><path d="M130 675 L655 525"/><path d="M130 690 L905 525"/><path d="M130 705 L1155 525"/><path d="M130 720 L405 610"/><path d="M130 735 L655 610"/><path d="M130 750 L905 610"/>
    <path d="M1750 600 L1365 900"/><path d="M1750 620 L1365 1015"/><path d="M1750 640 L1365 1090"/>
    <path d="M1750 670 L1365 900"/>
  </g>
  <!-- payment -->
  <path d="M1750 1010 L1365 525" class="assoc" marker-end="url(#arrow)"/>

  <!-- relationship notes -->
  <g class="include" marker-end="url(#blueArrow)">
    <path d="M900 560 C820 590 820 545 825 525"/>
    <path d="M930 560 C885 635 830 660 865 695"/>
    <path d="M1150 490 C1080 455 1000 455 1005 490"/>
  </g>
  <g class="small">
    <text x="805" y="585" fill="#0284c7">&lt;&lt;include&gt;&gt;</text>
    <text x="815" y="665" fill="#0284c7">&lt;&lt;include&gt;&gt;</text>
    <text x="1015" y="448" fill="#0284c7">&lt;&lt;include&gt;&gt;</text>
  </g>

  <!-- legend -->
  <rect x="370" y="1185" width="1180" height="55" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
  <line x1="400" y1="1213" x2="480" y2="1213" class="assoc" marker-end="url(#arrow)"/><text x="495" y="1219" class="small">关联：角色可以使用该功能</text>
  <line x1="770" y1="1213" x2="850" y2="1213" class="include" marker-end="url(#blueArrow)"/><text x="865" y="1219" class="small">include：必须包含的子功能</text>
  <text x="1230" y="1219" class="small">注：支付系统是否保留取决于课设是否接入真实支付服务</text>
</svg>
