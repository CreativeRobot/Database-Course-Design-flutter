<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1370" viewBox="0 0 1900 1370">
  <defs>
    <style>
      .title{font:700 30px "Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif;fill:#0f172a}
      .subtitle{font:400 16px "Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif;fill:#64748b}
      .group-title{font:700 19px "Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif;fill:#1e293b}
      .label{font:500 15px "Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif;fill:#0f172a}
      .actor-label{font:600 18px "Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif;fill:#0f172a}
      .small{font:400 14px "Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif;fill:#475569}
      .actor-line{stroke:#334155;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
      .assoc{stroke:#64748b;stroke-width:1.7;fill:none;opacity:.9}
      .include{stroke:#0284c7;stroke-width:2;fill:none;stroke-dasharray:7 6}
      .extend{stroke:#d97706;stroke-width:2;fill:none;stroke-dasharray:7 6}
    </style>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#64748b"/></marker>
    <marker id="blueArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#0284c7"/></marker>
    <marker id="orangeArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#d97706"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#94a3b8" flood-opacity=".22"/></filter>
  </defs>
  <rect width="1900" height="1370" fill="#f8fafc"/>

  <rect x="300" y="110" width="1300" height="1160" rx="18" fill="#fff" stroke="#1e293b" stroke-width="3" filter="url(#shadow)"/>
  <text x="330" y="147" class="group-title">在线书店系统</text>

  <rect x="335" y="175" width="1230" height="240" rx="14" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
  <text x="360" y="210" class="group-title">公共浏览与认证</text>
  <rect x="335" y="440" width="1230" height="390" rx="14" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="2"/>
  <text x="360" y="475" class="group-title">用户购书与个人中心</text>
  <rect x="335" y="855" width="1230" height="380" rx="14" fill="#fff7ed" stroke="#fed7aa" stroke-width="2"/>
  <text x="360" y="890" class="group-title">管理员后台</text>

  <!-- public use cases -->
  <g fill="#fff" stroke="#334155" stroke-width="2">
    <ellipse cx="510" cy="270" rx="105" ry="34"/><ellipse cx="770" cy="270" rx="105" ry="34"/><ellipse cx="1030" cy="270" rx="105" ry="34"/><ellipse cx="1290" cy="270" rx="105" ry="34"/>
    <ellipse cx="640" cy="355" rx="105" ry="34"/><ellipse cx="900" cy="355" rx="105" ry="34"/><ellipse cx="1160" cy="355" rx="105" ry="34"/>
    <!-- customer use cases -->
    <ellipse cx="510" cy="535" rx="105" ry="34"/><ellipse cx="770" cy="535" rx="105" ry="34"/><ellipse cx="1030" cy="535" rx="105" ry="34"/><ellipse cx="1290" cy="535" rx="105" ry="34"/>
    <ellipse cx="510" cy="625" rx="105" ry="34"/><ellipse cx="770" cy="625" rx="105" ry="34"/><ellipse cx="1030" cy="625" rx="105" ry="34"/><ellipse cx="1290" cy="625" rx="105" ry="34"/>
    <ellipse cx="510" cy="715" rx="105" ry="34"/><ellipse cx="770" cy="715" rx="105" ry="34"/><ellipse cx="1030" cy="715" rx="105" ry="34"/><ellipse cx="1290" cy="715" rx="105" ry="34"/>
    <!-- admin use cases -->
    <ellipse cx="510" cy="945" rx="105" ry="34"/><ellipse cx="770" cy="945" rx="105" ry="34"/><ellipse cx="1030" cy="945" rx="105" ry="34"/><ellipse cx="1290" cy="945" rx="105" ry="34"/>
    <ellipse cx="510" cy="1040" rx="105" ry="34"/><ellipse cx="770" cy="1040" rx="105" ry="34"/><ellipse cx="1030" cy="1040" rx="105" ry="34"/><ellipse cx="1290" cy="1040" rx="105" ry="34"/>
    <ellipse cx="770" cy="1135" rx="105" ry="34"/><ellipse cx="1030" cy="1135" rx="105" ry="34"/>
  </g>
  <g class="label" text-anchor="middle">
    <text x="510" y="276">注册账号</text><text x="770" y="276">登录系统</text><text x="1030" y="276">浏览图书</text><text x="1290" y="276">搜索图书</text>
    <text x="640" y="361">查看图书详情</text><text x="900" y="361">查看图书评价</text><text x="1160" y="361">查看推荐图书</text>
    <text x="510" y="541">管理购物车</text><text x="770" y="541">提交订单</text><text x="1030" y="541">模拟支付</text><text x="1290" y="541">查看订单详情</text>
    <text x="510" y="631">取消订单</text><text x="770" y="631">确认收货</text><text x="1030" y="631">申请售后/退款</text><text x="1290" y="631">提交/修改评价</text>
    <text x="510" y="721">管理个人资料</text><text x="770" y="721">管理收货地址</text><text x="1030" y="721">修改密码</text><text x="1290" y="721">退出登录</text>
    <text x="510" y="951">查看经营概览</text><text x="770" y="951">图书管理</text><text x="1030" y="951">作者管理</text><text x="1290" y="951">出版社管理</text>
    <text x="510" y="1046">分类管理</text><text x="770" y="1046">订单管理与发货</text><text x="1030" y="1046">评价审核</text><text x="1290" y="1046">库存流水查询</text>
    <text x="770" y="1141">用户管理</text><text x="1030" y="1141">售后审核</text>
  </g>

  <!-- actors -->
  <g class="actor-line">
    <circle cx="100" cy="300" r="22"/><path d="M100 322 L100 387 M67 348 L133 348 M100 387 L70 434 M100 387 L130 434"/>
    <circle cx="100" cy="640" r="22"/><path d="M100 662 L100 727 M67 688 L133 688 M100 727 L70 774 M100 727 L130 774"/>
    <circle cx="1795" cy="1010" r="22"/><path d="M1795 1032 L1795 1097 M1762 1058 L1828 1058 M1795 1097 L1765 1144 M1795 1097 L1825 1144"/>
  </g>
  <text x="100" y="469" text-anchor="middle" class="actor-label">游客</text>
  <text x="100" y="808" text-anchor="middle" class="actor-label">普通用户</text>
  <text x="1795" y="1180" text-anchor="middle" class="actor-label">管理员</text>

  <!-- visitor associations -->
  <g class="assoc" marker-end="url(#arrow)">
    <path d="M135 335 L405 270"/><path d="M135 355 L665 270"/><path d="M135 375 L925 270"/><path d="M135 395 L1185 270"/>
    <path d="M135 415 L535 355"/><path d="M135 430 L795 355"/>
  </g>
  <!-- customer associations -->
  <g class="assoc" marker-end="url(#arrow)">
    <path d="M135 675 L405 535"/><path d="M135 690 L665 535"/><path d="M135 705 L925 535"/><path d="M135 720 L1185 535"/>
    <path d="M135 735 L405 625"/><path d="M135 750 L665 625"/><path d="M135 765 L925 625"/><path d="M135 780 L1185 625"/>
    <path d="M135 795 L405 715"/><path d="M135 805 L665 715"/><path d="M135 815 L925 715"/><path d="M135 825 L1185 715"/>
  </g>
  <!-- admin associations -->
  <g class="assoc" marker-end="url(#arrow)">
    <path d="M1760 1010 L1395 945"/><path d="M1760 1025 L1395 1040"/><path d="M1760 1040 L1135 1135"/>
    <path d="M1760 1055 L1135 1040"/><path d="M1760 1070 L1135 945"/><path d="M1760 1085 L875 945"/>
    <path d="M1760 1100 L615 945"/><path d="M1760 1115 L355 945"/><path d="M1760 1130 L875 1135"/><path d="M1760 1145 L615 1040"/>
  </g>

  <!-- semantic relationships -->
  <g class="include" marker-end="url(#blueArrow)">
    <path d="M665 570 C610 585 590 575 590 570"/><path d="M730 570 C700 650 700 680 700 680"/>
    <path d="M1140 570 C1110 590 1080 590 1070 570"/>
  </g>
  <g class="small">
    <text x="570" y="590" fill="#0284c7">&lt;&lt;include&gt;&gt;</text>
    <text x="690" y="670" fill="#0284c7">&lt;&lt;include&gt;&gt;</text>
    <text x="1060" y="600" fill="#0284c7">&lt;&lt;include&gt;&gt;</text>
  </g>
  <g class="extend" marker-end="url(#orangeArrow)">
    <path d="M1015 500 C970 470 900 470 870 500"/><path d="M1150 590 C1200 570 1230 570 1240 590"/>
  </g>
  <g class="small">
    <text x="885" y="468" fill="#d97706">&lt;&lt;extend&gt;&gt;</text>
    <text x="1190" y="565" fill="#d97706">&lt;&lt;extend&gt;&gt;</text>
  </g>

  <rect x="335" y="1288" width="1230" height="50" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
  <line x1="365" y1="1313" x2="440" y2="1313" class="assoc" marker-end="url(#arrow)"/><text x="455" y="1319" class="small">实线：角色可以使用该功能</text>
  <line x1="735" y1="1313" x2="810" y2="1313" class="include" marker-end="url(#blueArrow)"/><text x="825" y="1319" class="small">include：必须包含的子功能</text>
  <line x1="1130" y1="1313" x2="1205" y2="1313" class="extend" marker-end="url(#orangeArrow)"/><text x="1220" y="1319" class="small">extend：满足条件时的可选扩展</text>
</svg>

